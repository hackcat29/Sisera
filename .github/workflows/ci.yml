name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sisera
          POSTGRES_PASSWORD: sisera
          POSTGRES_DB: sisera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisera -d sisera_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test
      - run: node scripts/verify-migrations.mjs
        env:
          DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          MARKETPLACE_TEST_DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test
      - run: pnpm build
      - name: Verify account persistence and bridge ownership
        run: node scripts/verify-account-persistence.mjs
        env:
          DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test

name: deploy-production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sisera
          POSTGRES_PASSWORD: sisera
          POSTGRES_DB: sisera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisera -d sisera_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify fresh PostgreSQL migrations
        run: pnpm db:migrate && node scripts/verify-migrations.mjs
        env:
          DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Integration tests
        run: pnpm test
        env:
          MARKETPLACE_TEST_DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test

      - name: Build packages & web
        run: pnpm build

      - name: Verify account persistence and bridge ownership
        run: node scripts/verify-account-persistence.mjs
        env:
          DATABASE_URL: postgresql://sisera:sisera@127.0.0.1:5432/sisera_test

  deploy-contabo:
    name: Deploy to Contabo VPS (Native Node / systemd)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Deployment Secrets
        run: |
          HOST="${{ secrets.CONTABO_HOST || secrets.VPS_HOST || secrets.HOST || secrets.SERVER_HOST }}"
          USER="${{ secrets.CONTABO_USER || secrets.VPS_USER || secrets.SSH_USER || 'root' }}"
          KEY="${{ secrets.CONTABO_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}"

          MISSING=""
          if [ -z "$HOST" ]; then MISSING="$MISSING CONTABO_HOST"; fi
          if [ -z "$USER" ]; then MISSING="$MISSING CONTABO_USER"; fi
          if [ -z "$KEY" ]; then MISSING="$MISSING CONTABO_SSH_KEY"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::Deployment Secrets Missing:$MISSING"
            echo "=================================================================================="
            echo "REQUIRED GITHUB ACTIONS SECRETS MISSING FOR CONTABO VPS DEPLOYMENT:"
            echo "Please configure the following Repository Secrets at:"
            echo "https://github.com/hackcat29/Sisera/settings/secrets/actions"
            echo ""
            echo "  - CONTABO_HOST     : Contabo VPS IP address or hostname"
            echo "  - CONTABO_USER     : SSH username (e.g., root)"
            echo "  - CONTABO_SSH_KEY  : SSH private key for VPS access"
            echo "  - CONTABO_SSH_PORT : (Optional) SSH port, defaults to 22"
            echo "=================================================================================="
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SISERA_DEPLOY_HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SISERA_DEPLOY_PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          SISERA_DEPLOY_COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          SISERA_DEPLOY_PANTA_API_KEY: ${{ secrets.PANTA_API_KEY }}
          SISERA_DEPLOY_JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SISERA_DEPLOY_LIVE_SOLANA_ENABLED: ${{ secrets.SISERA_LIVE_SOLANA_ENABLED }}
          SISERA_DEPLOY_LIVE_PREDICTIONS_ENABLED: ${{ secrets.SISERA_LIVE_PREDICTIONS_ENABLED }}
          SISERA_DEPLOY_LIVE_BINANCE_ENABLED: ${{ secrets.SISERA_LIVE_BINANCE_ENABLED }}
          SISERA_DEPLOY_CLAWPUMP_API_KEY: ${{ secrets.CLAWPUMP_API_KEY }}
          SISERA_DEPLOY_RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          SISERA_DEPLOY_X_BEARER_TOKEN: ${{ secrets.SISERA_X_BEARER_TOKEN }}
          SISERA_DEPLOY_X_TRACKED_ACCOUNTS: ${{ secrets.SISERA_X_TRACKED_ACCOUNTS }}
          SISERA_DEPLOY_X_MAX_DAILY_SPEND_USD: ${{ secrets.SISERA_X_MAX_DAILY_SPEND_USD }}
          SISERA_DEPLOY_TELEGRAM_NEWS_CHANNELS: ${{ secrets.SISERA_TELEGRAM_NEWS_CHANNELS }}
          SISERA_DEPLOY_TELEGRAM_BOT_TOKEN: ${{ secrets.SISERA_TELEGRAM_BOT_TOKEN }}
          SISERA_DEPLOY_TELEGRAM_CHAT_ID: ${{ secrets.SISERA_TELEGRAM_CHAT_ID }}
          SISERA_DEPLOY_BUYBOT_ENABLED: ${{ secrets.SISERA_BUYBOT_ENABLED }}
          SISERA_DEPLOY_BUYBOT_MIN_USD: ${{ secrets.SISERA_BUYBOT_MIN_USD }}
          SISERA_DEPLOY_DISCORD_BOT_TOKEN: ${{ secrets.SISERA_DISCORD_BOT_TOKEN }}
          SISERA_DEPLOY_DISCORD_CHANNEL_IDS: ${{ secrets.SISERA_DISCORD_CHANNEL_IDS }}
          SISERA_DEPLOY_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.SISERA_OPENROUTER_API_KEY }}
          SISERA_DEPLOY_INTELLIGENCE_MODEL: ${{ secrets.SISERA_INTELLIGENCE_MODEL || secrets.SISERA_OPENROUTER_MODEL }}
          SISERA_DEPLOY_LIVE_LAUNCHES_ENABLED: ${{ secrets.SISERA_LIVE_LAUNCHES_ENABLED }}
          SISERA_DEPLOY_LIVE_AGENTS_ENABLED: ${{ secrets.SISERA_LIVE_AGENTS_ENABLED }}
          SISERA_DEPLOY_DELEGATED_SIGNING_ENABLED: ${{ secrets.SISERA_DELEGATED_SIGNING_ENABLED }}
          SISERA_DEPLOY_PRIVY_AUTHORIZATION_PRIVATE_KEY: ${{ secrets.PRIVY_AUTHORIZATION_PRIVATE_KEY }}
          SISERA_DEPLOY_DBC_PARTNER_WALLET: ${{ secrets.SISERA_DBC_PARTNER_WALLET }}
          SISERA_DEPLOY_SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          SISERA_DEPLOY_BUILDER_ADDRESS: ${{ secrets.SISERA_BUILDER_ADDRESS }}
          SISERA_DEPLOY_JUPITER_REFERRAL_ACCOUNT: ${{ secrets.SISERA_JUPITER_REFERRAL_ACCOUNT }}
          SISERA_DEPLOY_RELAY_FEE_RECIPIENT: ${{ secrets.SISERA_RELAY_FEE_RECIPIENT }}
          SISERA_DEPLOY_SOLANA_FEE_ACCOUNT: ${{ secrets.SISERA_SOLANA_FEE_ACCOUNT }}
          SISERA_DEPLOY_LIVE_HYPERLIQUID_ENABLED: ${{ secrets.SISERA_LIVE_HYPERLIQUID_ENABLED }}
        with:
          host: ${{ secrets.CONTABO_HOST || secrets.VPS_HOST || secrets.HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.CONTABO_USER || secrets.VPS_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.CONTABO_SSH_KEY || secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          envs: SISERA_DEPLOY_PANTA_API_KEY,SISERA_DEPLOY_HELIUS_API_KEY,SISERA_DEPLOY_PYTH_API_KEY,SISERA_DEPLOY_COINMARKETCAP_API_KEY,SISERA_DEPLOY_JUPITER_API_KEY,SISERA_DEPLOY_LIVE_SOLANA_ENABLED,SISERA_DEPLOY_LIVE_PREDICTIONS_ENABLED,SISERA_DEPLOY_LIVE_BINANCE_ENABLED,SISERA_DEPLOY_CLAWPUMP_API_KEY,SISERA_DEPLOY_RELAY_API_KEY,SISERA_DEPLOY_X_BEARER_TOKEN,SISERA_DEPLOY_X_TRACKED_ACCOUNTS,SISERA_DEPLOY_X_MAX_DAILY_SPEND_USD,SISERA_DEPLOY_TELEGRAM_NEWS_CHANNELS,SISERA_DEPLOY_TELEGRAM_BOT_TOKEN,SISERA_DEPLOY_TELEGRAM_CHAT_ID,SISERA_DEPLOY_BUYBOT_ENABLED,SISERA_DEPLOY_BUYBOT_MIN_USD,SISERA_DEPLOY_DISCORD_BOT_TOKEN,SISERA_DEPLOY_DISCORD_CHANNEL_IDS,SISERA_DEPLOY_OPENROUTER_API_KEY,SISERA_DEPLOY_INTELLIGENCE_MODEL,SISERA_DEPLOY_LIVE_LAUNCHES_ENABLED,SISERA_DEPLOY_LIVE_AGENTS_ENABLED,SISERA_DEPLOY_DELEGATED_SIGNING_ENABLED,SISERA_DEPLOY_PRIVY_AUTHORIZATION_PRIVATE_KEY,SISERA_DEPLOY_DBC_PARTNER_WALLET,SISERA_DEPLOY_SEC_EDGAR_USER_AGENT,SISERA_DEPLOY_BUILDER_ADDRESS,SISERA_DEPLOY_JUPITER_REFERRAL_ACCOUNT,SISERA_DEPLOY_RELAY_FEE_RECIPIENT,SISERA_DEPLOY_SOLANA_FEE_ACCOUNT,SISERA_DEPLOY_LIVE_HYPERLIQUID_ENABLED
          script: |
            set -e
            APP_DIR="/opt/sisera"

            echo "==> Deploying Sisera to $APP_DIR"

            # Ensure PATH includes NVM, pnpm, node, and PM2 locations for non-interactive SSH
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:~/.local/share/pnpm:~/.pnpm:~/.npm-global/bin:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/root/.local/share/pnpm:/root/.pnpm

            # Source shell environment scripts if available
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"
            [ -s "/root/.nvm/nvm.sh" ] && . "/root/.nvm/nvm.sh"

            # Ensure git safe directory setting
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            cd "$APP_DIR"
            # Refuse to alter another project on a shared VPS.
            node -e 'if (require("./package.json").name !== "sisera") { console.error("ERROR: Deployment directory is not the Sisera workspace."); process.exit(1); }'
            if [ -e .git ] && [ "$(git rev-parse --show-toplevel)" != "$(pwd -P)" ]; then
              echo "ERROR: Sisera must have its own Git checkout."
              exit 1
            fi

            # Optional GitHub Actions provider secrets persist in the VPS-only environment file.
            # The web and API services both load this file after restart.
            node <<'NODE'
            const fs = require('node:fs');
            const path = fs.existsSync('.env.production') ? '.env.production' : '.env';
            if (!fs.existsSync(path)) {
              console.error('ERROR: VPS environment file is missing.');
              process.exit(1);
            }
            const values = {
              HELIUS_API_KEY: process.env.SISERA_DEPLOY_HELIUS_API_KEY,
              PYTH_API_KEY: process.env.SISERA_DEPLOY_PYTH_API_KEY,
              COINMARKETCAP_API_KEY: process.env.SISERA_DEPLOY_COINMARKETCAP_API_KEY,
              PANTA_API_KEY: process.env.SISERA_DEPLOY_PANTA_API_KEY,
              JUPITER_API_KEY: process.env.SISERA_DEPLOY_JUPITER_API_KEY,
              SISERA_LIVE_SOLANA_ENABLED: process.env.SISERA_DEPLOY_LIVE_SOLANA_ENABLED,
              SISERA_LIVE_PREDICTIONS_ENABLED: process.env.SISERA_DEPLOY_LIVE_PREDICTIONS_ENABLED,
              SISERA_LIVE_BINANCE_ENABLED: process.env.SISERA_DEPLOY_LIVE_BINANCE_ENABLED,
              CLAWPUMP_API_KEY: process.env.SISERA_DEPLOY_CLAWPUMP_API_KEY,
              RELAY_API_KEY: process.env.SISERA_DEPLOY_RELAY_API_KEY,
              SISERA_X_BEARER_TOKEN: process.env.SISERA_DEPLOY_X_BEARER_TOKEN,
              SISERA_X_TRACKED_ACCOUNTS: process.env.SISERA_DEPLOY_X_TRACKED_ACCOUNTS,
              SISERA_X_MAX_DAILY_SPEND_USD: process.env.SISERA_DEPLOY_X_MAX_DAILY_SPEND_USD,
              SISERA_TELEGRAM_NEWS_CHANNELS: process.env.SISERA_DEPLOY_TELEGRAM_NEWS_CHANNELS,
              SISERA_TELEGRAM_BOT_TOKEN: process.env.SISERA_DEPLOY_TELEGRAM_BOT_TOKEN,
              SISERA_TELEGRAM_CHAT_ID: process.env.SISERA_DEPLOY_TELEGRAM_CHAT_ID,
              SISERA_BUYBOT_ENABLED: process.env.SISERA_DEPLOY_BUYBOT_ENABLED,
              SISERA_BUYBOT_MIN_USD: process.env.SISERA_DEPLOY_BUYBOT_MIN_USD,
              SISERA_DISCORD_BOT_TOKEN: process.env.SISERA_DEPLOY_DISCORD_BOT_TOKEN,
              SISERA_DISCORD_CHANNEL_IDS: process.env.SISERA_DEPLOY_DISCORD_CHANNEL_IDS,
              OPENROUTER_API_KEY: process.env.SISERA_DEPLOY_OPENROUTER_API_KEY,
              SISERA_INTELLIGENCE_MODEL: process.env.SISERA_DEPLOY_INTELLIGENCE_MODEL,
              SISERA_LIVE_LAUNCHES_ENABLED: process.env.SISERA_DEPLOY_LIVE_LAUNCHES_ENABLED,
              SISERA_LIVE_AGENTS_ENABLED: process.env.SISERA_DEPLOY_LIVE_AGENTS_ENABLED,
              SISERA_DELEGATED_SIGNING_ENABLED: process.env.SISERA_DEPLOY_DELEGATED_SIGNING_ENABLED,
              PRIVY_AUTHORIZATION_PRIVATE_KEY: process.env.SISERA_DEPLOY_PRIVY_AUTHORIZATION_PRIVATE_KEY,
              SISERA_DBC_PARTNER_WALLET: process.env.SISERA_DEPLOY_DBC_PARTNER_WALLET,
              SEC_EDGAR_USER_AGENT: process.env.SISERA_DEPLOY_SEC_EDGAR_USER_AGENT,
              SISERA_BUILDER_ADDRESS: process.env.SISERA_DEPLOY_BUILDER_ADDRESS,
              SISERA_JUPITER_REFERRAL_ACCOUNT: process.env.SISERA_DEPLOY_JUPITER_REFERRAL_ACCOUNT,
              SISERA_RELAY_FEE_RECIPIENT: process.env.SISERA_DEPLOY_RELAY_FEE_RECIPIENT,
              SISERA_SOLANA_FEE_ACCOUNT: process.env.SISERA_DEPLOY_SOLANA_FEE_ACCOUNT,
              SISERA_LIVE_HYPERLIQUID_ENABLED: process.env.SISERA_DEPLOY_LIVE_HYPERLIQUID_ENABLED,
            };
            if (values.HELIUS_API_KEY) {
              values.SOLANA_RPC_URL = `https://mainnet.helius-rpc.com/?api-key=${values.HELIUS_API_KEY}`;
            }
            const entries = Object.entries(values).filter(([, value]) => value);
            for (const [name, value] of entries) {
              if (/[\r\n\0]/.test(value)) {
                console.error(`ERROR: ${name} contains a control character.`);
                process.exit(1);
              }
            }
            if (entries.length) {
              const replaced = new Set(entries.map(([name]) => name));
              const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/)
                .filter((line) => !replaced.has(line.split('=', 1)[0]));
              const quote = (value) => `'${value.replaceAll("'", "'\\''")}'`;
              fs.writeFileSync(path, `${lines.filter(Boolean).join('\n')}\n${entries.map(([name, value]) => `${name}=${quote(value)}`).join('\n')}\n`, { mode: 0o600 });
              fs.chmodSync(path, 0o600);
              console.log('Provider secrets synchronized to VPS environment.');
            }
            NODE

            # Load environment variables if available
            if [ -f .env.production ]; then
              set -a
              . .env.production
              set +a
            elif [ -f .env ]; then
              set -a
              . .env
              set +a
            fi

            # Both Next's browser bundle and the API must use the same Privy application.
            : "${NEXT_PUBLIC_PRIVY_APP_ID:?NEXT_PUBLIC_PRIVY_APP_ID is required in the VPS environment}"
            : "${PRIVY_APP_ID:?PRIVY_APP_ID is required in the VPS environment}"
            : "${PRIVY_APP_SECRET:?PRIVY_APP_SECRET is required in the VPS environment}"
            : "${DATABASE_URL:?DATABASE_URL is required in the VPS environment}"
            node -e 'const host = new URL(process.env.DATABASE_URL).hostname; if (!["localhost", "127.0.0.1", "[::1]"].includes(host)) { console.error("ERROR: Production PostgreSQL must run on this VPS."); process.exit(1); }'
            if [ "$NEXT_PUBLIC_PRIVY_APP_ID" != "$PRIVY_APP_ID" ]; then
              echo "ERROR: The browser and server Privy app IDs do not match."
              exit 1
            fi
            export SISERA_API_URL="${SISERA_API_URL:-http://127.0.0.1:${API_PORT:-4200}}"

            # Ensure git repository is in sync
            echo "==> Fetching latest changes from main branch..."
            if [ ! -e .git ]; then
              echo "==> Initializing git repository in $APP_DIR..."
              git init
            fi
            # Refresh existing VPS checkouts after a repository migration.
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin https://github.com/hackcat29/Sisera.git
            else
              git remote add origin https://github.com/hackcat29/Sisera.git
            fi
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies
            echo "==> Installing Node.js workspace dependencies..."
            # pnpm may ask to replace an existing node_modules directory after a
            # lockfile or workspace change. SSH has no interactive stdin, so the
            # prompt otherwise skips the install while the script continues.
            if command -v pnpm >/dev/null 2>&1; then
              CI=true pnpm install --frozen-lockfile --prod=false
            else
              CI=true npx --yes pnpm@9.0.0 install --frozen-lockfile --prod=false
            fi

            # Apply pending database migrations
            # Save a restorable snapshot before any schema change. A failed backup stops the release.
            command -v pg_dump >/dev/null 2>&1 || { echo "ERROR: pg_dump is required before migration."; exit 1; }
            install -d -m 700 /opt/sisera-backups
            BACKUP_FILE="/opt/sisera-backups/sisera-$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --file="$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            echo "==> PostgreSQL backup saved before migration."
            echo "==> Running PostgreSQL database migrations..."
            if command -v pnpm >/dev/null 2>&1; then
              pnpm db:migrate
            else
              npx pnpm db:migrate
            fi

            # Build the API and packages before replacing the running web bundle.
            echo "==> Building Sisera API and packages..."
            if command -v pnpm >/dev/null 2>&1; then
              pnpm exec turbo run build --filter='!@sisera/web' --cache-dir=.turbo/cache
            else
              npx pnpm exec turbo run build --filter='!@sisera/web' --cache-dir=.turbo/cache
            fi

            # Build Next in a separate directory so the running process keeps its assets.
            echo "==> Building fresh Sisera web bundle..."
            rm -rf apps/web/.next-candidate
            # The live bundle's generated route types describe the previous release's pages. Next's
            # type check reads them too, so a moved or deleted page fails the new build. The running
            # server never reads these type stubs, so removing them is safe.
            rm -rf apps/web/.next/types
            if command -v pnpm >/dev/null 2>&1; then
              SISERA_NEXT_DIST_DIR=.next-candidate pnpm --filter @sisera/web build
            else
              SISERA_NEXT_DIST_DIR=.next-candidate npx pnpm --filter @sisera/web build
            fi
            test -f apps/web/.next-candidate/BUILD_ID
            git checkout -- apps/web/next-env.d.ts apps/web/tsconfig.json

            # Keep previous immutable chunks for tabs opened before this deploy.
            if [ -d apps/web/.next/static ]; then
              cp -an apps/web/.next/static/. apps/web/.next-candidate/static/
            fi
            rm -rf apps/web/.next-previous
            if [ -d apps/web/.next ]; then mv apps/web/.next apps/web/.next-previous; fi
            mv apps/web/.next-candidate apps/web/.next

            # Restart the services that own the public Nginx upstreams.
            echo "==> Managing application services..."
            WEB_PORT="${PORT:-3100}"
            API_HEALTH_PORT="${API_PORT:-4200}"
            if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet sisera-api && systemctl is-active --quiet sisera-web; then
              SERVICE_MANAGER=systemd
              systemctl restart sisera-api sisera-web
              systemctl status sisera-api sisera-web --no-pager
            elif command -v pm2 >/dev/null 2>&1; then
              SERVICE_MANAGER=pm2
              WEB_PORT=9000
              pm2 restart sisera-api --update-env || pm2 start ecosystem.config.cjs --only sisera-api --env production
              pm2 restart sisera-web --update-env || pm2 start ecosystem.config.cjs --only sisera-web --env production
              pm2 save
              pm2 status
            elif command -v npx >/dev/null 2>&1 && npx pm2 status >/dev/null 2>&1; then
              SERVICE_MANAGER=pm2
              WEB_PORT=9000
              npx pm2 restart sisera-api --update-env || npx pm2 start ecosystem.config.cjs --only sisera-api --env production
              npx pm2 restart sisera-web --update-env || npx pm2 start ecosystem.config.cjs --only sisera-web --env production
              npx pm2 save
              npx pm2 status
            else
              echo "ERROR: Neither PM2 nor systemctl available to manage services."
              exit 1
            fi

            wait_for_service() {
              SERVICE_NAME="$1"
              SERVICE_URL="$2"
              ATTEMPT=0
              until curl --fail --silent --max-time 3 "$SERVICE_URL" -o /dev/null; do
                ATTEMPT=$((ATTEMPT + 1))
                if [ "$ATTEMPT" -ge 30 ]; then
                  echo "ERROR: $SERVICE_NAME did not become ready at $SERVICE_URL within 90 seconds."
                  if [ "$SERVICE_MANAGER" = systemd ]; then
                    systemctl status "$SERVICE_NAME" --no-pager || true
                  else
                    pm2 logs "$SERVICE_NAME" --nostream --lines 60 || true
                  fi
                  exit 1
                fi
                sleep 3
              done
            }
            wait_for_service sisera-api "http://127.0.0.1:$API_HEALTH_PORT/health/ready"
            wait_for_service sisera-web "http://127.0.0.1:$WEB_PORT/sign-in"
            echo "==> API and web are accepting requests."
            EXPECTED_SIGNIN_CHUNK="$(node -e 'const files=require("./apps/web/.next/app-build-manifest.json").pages["/sign-in/page"];const chunk=files?.find((file)=>file.includes("app/sign-in/page-"));if(!chunk)process.exit(1);process.stdout.write(chunk)')"
            echo "==> Expected sign-in asset: /_next/$EXPECTED_SIGNIN_CHUNK"
            PUBLIC_BASE_URL="${SISERA_PUBLIC_URL:-https://sisera.xyz}"
            for BASE_URL in "http://127.0.0.1:$WEB_PORT" "$PUBLIC_BASE_URL"; do
              echo "==> Checking sign-in at $BASE_URL"
              curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/sign-in" -D /tmp/sisera-sign-in.headers -o /tmp/sisera-sign-in.html
              if ! grep -F "/_next/$EXPECTED_SIGNIN_CHUNK" /tmp/sisera-sign-in.html >/dev/null; then
                echo "ERROR: $BASE_URL served sign-in HTML from a different build."
                grep -oE '/_next/static/chunks/app/sign-in/page-[a-z0-9]+\.js' /tmp/sisera-sign-in.html | head -1 || true
                grep -i '^cache-control:' /tmp/sisera-sign-in.headers || true
                echo "==> Checking whether the VPS reverse proxy serves the new build..."
                if curl -k --fail --silent --max-time 5 --resolve sisera.xyz:443:127.0.0.1 https://sisera.xyz/sign-in -o /tmp/sisera-origin-sign-in.html; then
                  grep -oE '/_next/static/chunks/app/sign-in/page-[a-z0-9]+\.js' /tmp/sisera-origin-sign-in.html | head -1 || true
                else
                  echo "Local HTTPS proxy did not answer on port 443."
                fi
                echo "==> Checking for another Next server on port 3000..."
                if curl --fail --silent --max-time 5 http://127.0.0.1:3000/sign-in -o /tmp/sisera-port-3000.html; then
                  grep -oE '/_next/static/chunks/app/sign-in/page-[a-z0-9]+\.js' /tmp/sisera-port-3000.html | head -1 || true
                else
                  echo "No sign-in page answered on port 3000."
                fi
                echo "==> Sisera reverse proxy directives..."
                for PROXY_FILE in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/caddy/Caddyfile; do
                  if [ -f "$PROXY_FILE" ] && grep -q 'sisera.xyz' "$PROXY_FILE"; then
                    echo "Proxy file: $PROXY_FILE"
                    grep -nE 'server_name|proxy_pass|reverse_proxy|listen' "$PROXY_FILE" || true
                  fi
                done
                echo "==> Listeners on web ports..."
                ss -ltnp | grep -E ':(80|443|3000|9000)[[:space:]]' || true
                exit 1
              fi
              curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/_next/$EXPECTED_SIGNIN_CHUNK" -o /dev/null
            done
            rm -rf apps/web/.next-previous

            echo "==> Sisera Production Stack successfully deployed and active!"
